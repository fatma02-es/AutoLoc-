spring.application.name=fatmasouei4CC19

# Serveur et préfixe commun
server.port=8089
server.servlet.context-path=/api

# Jackson
spring.jackson.serialization.fail-on-empty-beans=false

# Connexion MySQL
spring.datasource.url=jdbc:mysql://localhost:3306/autoloc_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Logs
logging.level.tn.esprit=INFO
logging.level.org.hibernate.SQL=DEBUG
